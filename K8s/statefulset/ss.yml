apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: ssdatabse
    labels:
         app: ssdb
spec:
   replicas: 3
   serviceName: ssvish
   selector:
     matchLabels:
         app: ssdb
   template:
      metadata: 
          labels: 
             app: ssdb
             name: sspod
          
      spec: 
       containers:
       - name: ssdb
         image: mysql:latest
         ports:
          - containerPort: 3306
            protocol: TCP
         env:
          - name: MYSQL_ROOT_PASSWORD
            value: "123456"
