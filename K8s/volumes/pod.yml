apiVersion: v1
kind: Pod
metadata:
    name: pod
spec:
 volumes:
   - name: mypvc
     persistentVolumeClaim:
       claimName: pv-claim
 containers:
     - image: nginx:latest
       ports: 
        - containerPort: 80
       name: nginxcont
       volumeMounts:
         - mountPath: "/mnt/data"
           name: mypvc

        
