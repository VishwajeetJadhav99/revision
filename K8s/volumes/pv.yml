apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-volume
  labels:
   app: pv
spec:
  storageClassName: standard
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  capacity:
   storage: 10Gi
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/mnt/data"


# pv have same yml file as pvc but instead of resource it has capacity parameter, persistentVolumeReclaimPolicy and hostPath: