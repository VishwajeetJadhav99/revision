apiVersion: networking.k8s.io/v1  
kind: Ingress
metadata:
   name: ingress-rule
   annotations:
     nginx.ingress.kubernetes.io/rewrite-target: /
spec: 
  ingressClassName: nginx
  rules:
   - host: a5d6195ea02b04c04aed6b0d1edcbf50-398085528.ap-south-1.elb.amazonaws.com
     http:
       paths:
        - path: / 
          pathType: Prefix
          backend:
            service:
               name: npci
               port: 
                 number: 80
         
        - path: /tomcat
          pathType: Prefix
          backend:
            service:
               name: tcci
               port: 
                 number: 8080
          

#Annotation = extra metadata or configuration instructions attached to a Kubernetes resource. 
#all ingress controllers have different annotations, search on internet for annotations
#in short annotations tells K8s which ingress controler is using because ingress controller is external object 
       
      