apiVersion: v1
kind: Pod
metadata:
    name: cipodf
    namespace: flipkart
    labels:
       app: cipodf 
spec:
  containers:
     - image: nginx:latest
       ports: 
        - containerPort: 80
       name: nginxcont

---
apiVersion: v1
kind: Service
metadata:
    name: ciservice
    namespace: flipkart
spec:
  selector:
      app: cipodf
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP