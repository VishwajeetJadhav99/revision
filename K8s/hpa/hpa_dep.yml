apiVersion: apps/v1
kind: Deployment
metadata:
    name: mederp
    labels:
       app: mederp

spec:
   replicas: 1 #Desired state
     
   selector:
     matchLabels:
        app: mederp

   strategy:
     type: RollingUpdate
     rollingUpdate:
       maxSurge: 1
       maxUnavailable: 1
 
   template:
      metadata:
        
          labels:
             app: mederp
      spec:
        containers:
          - name: mederp-container
            image: httpd
            ports: 
              - containerPort: 80
                
                protocol: TCP
        resources: 
          requests:  # lower limit
             cpu: "100m"
             memory: "256Mi"
          limits:   # upper limit
            cpu: "500m"
            memory: "512Mi"

---
apiVersion: autoscaling/v2 
kind: HorizontalPodAutoscaler
metadata:
  name: myhpa
  labels:
     app: myhpa
spec: 
  scaleTargetRef:
     apiVersion: apps/v1
     kind: Deployment
     name: mederp
     minReplicas: 1
     maxReplicas: 2
     metrics:
      - type: Resource
        resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 10
